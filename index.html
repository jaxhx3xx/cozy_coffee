<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cozy_coffee</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="all">
      <div id="top">
        <img src="images/logo.png" alt="로고사진" />
        <ul>
          <li><a href="#">[Home]</a></li>
          <li><a href="#">[Shop]</a></li>
          <li><a href="#">[Contact]</a></li>
          <li><a href="#">[Cart]</a></li>
        </ul>
      </div>
      <div id="mid">
        <h1>당신의 아침을 깨우는 완벽한 한 잔</h1>
        <h3>최상급 스페셜티 원두를 집에서 만나보세요.</h3>
        <img src="images/design.png" alt="디자인" />
      </div>
      <div id="under">
        <h2>우리들의 스페셜티 원두</h2>
        <div class="box1">
          <div class="innerbox1"><img src="/images/bean1.png" alt="콩" /></div>
          <div class="context">
            <h3>에티오피아 예가체프</h3>
            <p>Medium Roast | Floral & Citrus</p>
            <h3>15,000원</h3>
          </div>
        </div>
        <div class="box2">
          <div class="innerbox1"><img src="/images/bean2.png" alt="콩" /></div>
          <div class="context">
            <h3>콜로모비아 수뮤체프</h3>
            <p>Medium Roast | Floral & Citrus</p>
            <h3>18,000원</h3>
          </div>
        </div>
        <div class="box3">
          <div class="innerbox1"><img src="/images/bean3.png" alt="콩" /></div>
          <div class="context">
            <h3>브라질 Santos</h3>
            <p>Medium Roast | Floral & Citrus</p>
            <h3>14,500원</h3>
          </div>
        </div>
      </div>
    </div>

    <script src="mian.js"></script>
  </body>
</html>
